<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Nenovia — 手机端</title>
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }
    html, body { width: 100%; overflow-x: hidden; }
    body {
      background: #fff;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
    }
    .page { width: 100%; max-width: 750px; margin: 0 auto; }
    .page img {
      width: 100%;
      height: auto;
      display: block;
      margin-bottom: -1px;
    }
    /* 品牌介绍 文字版 */
    .section-brand-intro {
      background: #fff;
      padding: 48px 28px 56px;
      text-align: center;
    }
    .brand-top-label {
      margin-bottom: 32px;
    }
    .brand-title-cn {
      font-size: 13px;
      letter-spacing: 3px;
      color: #c88b9a;
      margin-bottom: 8px;
    }
    .brand-sub-cn {
      font-size: 11px;
      letter-spacing: 2px;
      color: #999;
    }
    .brand-headline-wrap {
      position: relative;
      margin-bottom: 36px;
      padding: 24px 0;
    }
    .brand-en-bg {
      font-family: "Times New Roman", "Noto Serif SC", "STSong", serif;
      font-size: 32px;
      line-height: 1.2;
      color: #e2b8c4;
      letter-spacing: 1px;
      font-style: italic;
    }
    .brand-en-bg--2 {
      font-size: 28px;
      margin-top: -2px;
    }
    .brand-cn-overlay {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      white-space: nowrap;
    }
    .brand-cn-overlay p {
      font-size: 15px;
      font-weight: 600;
      color: #c88b9a;
      letter-spacing: 2px;
      line-height: 1.8;
    }
    .brand-body-text {
      font-size: 13px;
      line-height: 2;
      color: #555;
    }
    .brand-body-text p {
      margin-bottom: 14px;
    }
    .brand-body-text p:last-child {
      margin-bottom: 0;
      font-weight: 500;
      color: #c88b9a;
      margin-top: 28px;
      letter-spacing: 1px;
    }
  </style>
</head>
<body>
  <div class="page">
    <img src="../img/sjd/mobile_reference_01.jpg" alt="" loading="eager">
    <!-- 第二屏：品牌升级 文字版 -->
    <div class="section-brand-intro">
      <div class="brand-top-label">
        <p class="brand-title-cn">NenoVia 品牌视觉全案</p>
        <p class="brand-sub-cn">配色 / 符号 / 材质 / 物料 / 统一性</p>
      </div>
      <div class="brand-headline-wrap">
        <p class="brand-en-bg">From Tool to Touch</p>
        <p class="brand-en-bg brand-en-bg--2">A Warm Rebirth</p>
        <div class="brand-cn-overlay">
          <p>从黑色工具感</p>
          <p>到有温度的视觉系统</p>
        </div>
      </div>
      <div class="brand-body-text">
        <p>在原产品模具不变的前提下，完成了<br>一次从视觉到触觉的品牌重塑。</p>
        <p>在"专业科技"与"女性温和"之间找到平衡，<br>建立一套有辨识度、可执行、可<br>感知的品牌视觉体系</p>
        <p>品牌调性，专业而不冰冷，科技而有温度</p>
      </div>
    </div>
    <img src="../img/sjd/mobile_reference_03.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_04.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_05.jpg" alt="" loading="lazy">
    <video src="../img/kuanp.mp4" autoplay muted loop playsinline width="100%" style="display:block;margin-bottom:-1px;" loading="lazy"></video>
    <img src="../img/sjd/mobile_reference_06.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_07.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_08.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_09.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_10.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_11.jpg" alt="" loading="lazy">

    <img src="../img/sjd/mobile_reference_24.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_25.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_26.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_27.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_28.jpg" alt="" loading="lazy">
    <img src="../img/sjd/mobile_reference_29.jpg" alt="" loading="lazy">
  </div>
</body>
</html>
